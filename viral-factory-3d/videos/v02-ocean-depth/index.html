const CARDS={1:['THE TWILIGHT ZONE','almost no sunlight below here'],2:["CUVIER'S BEAKED WHALE",'deepest mammal dive ever recorded'],3:['RMS TITANIC','wreck site, North Atlantic'],4:['CHALLENGER DEEP','Mariana Trench, deepest known point']};
function drawGauge(t,depth){const x=1000,y0=300,y1=1380;const dy=d=>y0+(y1-y0)*d/11000;
 ctx.save();ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,y0);ctx.lineTo(x,y1);ctx.stroke();
 for(let d=0;d<=11000;d+=1000){ctx.beginPath();ctx.moveTo(x-(d%5000?10:22),dy(d));ctx.lineTo(x,dy(d));ctx.stroke();}
 txt('0',x-34,y0,'700 26px G','rgba(255,255,255,.7)','right');txt('11 km',x-34,y1,'700 26px G','rgba(255,255,255,.7)','right');
 const dd=clamp(depth,0,11000);ctx.strokeStyle=CY;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(x,y0);ctx.lineTo(x,dy(dd));ctx.stroke();
 for(const m of MILES){if(dd>=m.d-5){ctx.fillStyle=CY;ctx.beginPath();ctx.arc(x,dy(m.d),10,0,7);ctx.fill();txt(m.n,x-26,dy(m.d),'700 24px G','#dffaff','right',400,6);}}
 ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(x+8,dy(dd));ctx.lineTo(x+30,dy(dd)-14);ctx.lineTo(x+30,dy(dd)+14);ctx.fill();ctx.restore();}
function drawDepth(t,depth){const k=clamp((t-1.2)/0.5);if(k<=0)return;ctx.save();ctx.globalAlpha=k;
 txt('DEPTH',W/2,150,'700 34px G','rgba(223,250,255,.8)','center');
 ctx.shadowColor=CY;ctx.shadowBlur=30;txt(fmt(Math.max(0,depth))+' m',W/2,245,'400 170px B',CY,'center',900,0);ctx.shadowBlur=0;
 const atm=1+Math.max(0,depth)/10.06;txt('PRESSURE ≈ '+fmt(atm)+' ATM',W/2,345,'700 32px G','#ffffff','center',900,0);
 ctx.restore();}
function drawCard(i,t){const c=CARDS[i];if(!c)return;const s=SEG[i];const lt=t-(MILES[i-1].seg===4?s.start+2.6:s.start+0.9);const k=pop(lt/0.4);if(k<=0)return;
 const fade=clamp((s.end+0.2-t)/0.3);ctx.save();ctx.globalAlpha=fade;ctx.translate(W/2-40,470);ctx.scale(k,k);
 ctx.fillStyle='rgba(2,14,30,.75)';rr(-400,-70,800,140,18);ctx.fill();ctx.fillStyle=CY;ctx.fillRect(-400,-70,10,140);
 txt(c[0],-360,-20,'700 50px G','#ffffff','left',740);txt(c[1],-360,36,'400 34px G','#bfefff','left',740);ctx.restore();}
function drawIntro(t){const s=SEG[0];if(t>s.end+0.2)return;const k=pop((t-0.1)/0.5);const fade=clamp((s.end+0.2-t)/0.4);
 ctx.save();ctx.globalAlpha=fade;ctx.translate(W/2,640);ctx.scale(k,k);
 txt('HOW DEEP IS',0,-110,'400 170px B','#ffffff','center',1000,14);txt('THE OCEAN?',0,60,'400 230px B',CY,'center',1000,16);ctx.restore();}
function drawCut(t){const s=SEG[5];const lt=t-s.start;if(lt<0)return;
 const k=pop((lt-0.05)/0.4);ctx.save();ctx.translate(W/2,190);ctx.scale(k,k);txt('DROP EVEREST IN',0,0,'400 130px B','#ffffff','center',1000,12);ctx.restore();
 const land=clamp((lt-1.7)/0.5);if(land<=0)return;
 // surface label + gap arrow
 const top=project(V(0,EV_TOP,0)),sfc=project(V(0,0,0)),bot=project(V(0,BOTTOM,0));
 ctx.save();ctx.globalAlpha=land;
 txt('SEA LEVEL',140,sfc.y-34,'700 34px G','#ffffff','left',500,6);
 const gx=W/2+0;ctx.strokeStyle=CY;ctx.lineWidth=6;ctx.setLineDash([16,12]);ctx.beginPath();ctx.moveTo(gx,sfc.y+8);ctx.lineTo(gx,top.y-8);ctx.stroke();ctx.setLineDash([]);
 for(const yy of[sfc.y+8,top.y-8]){ctx.beginPath();ctx.moveTo(gx-26,yy);ctx.lineTo(gx+26,yy);ctx.stroke();}
 const k2=pop((lt-2.2)/0.4);ctx.save();ctx.translate(gx+40,(sfc.y+top.y)/2);ctx.scale(k2,k2);ctx.fillStyle='rgba(2,14,30,.8)';rr(0,-54,330,108,18);ctx.fill();ctx.strokeStyle=CY;ctx.lineWidth=3;ctx.stroke();
 txt('2 KM',165,-14,'400 66px B',CY,'center',300);txt('of water above',165,30,'700 26px G','#fff','center',300);ctx.restore();
 const k3=pop((lt-2.8)/0.4);ctx.save();ctx.translate(W/2,(top.y+bot.y)/2+120);ctx.scale(k3,k3);
 txt('MOUNT EVEREST',0,-30,'400 84px B','#ffffff','center',800,10);txt('8,849 m',0,46,'400 72px B','#ffd36a','center',800,10);ctx.restore();
 txt('10,935 m',W/2+330,bot.y-40,'700 40px G',CY,'center',600,6);
 ctx.restore();}
function drawOutro(t){const s=SEG[6];const lt=t-s.start+0.2;if(lt<0)return;const k=pop(lt/0.4);
 ctx.save();ctx.translate(W/2,1740);ctx.scale(k,k);ctx.fillStyle='rgba(2,14,30,.85)';rr(-330,-64,660,128,64);ctx.fill();ctx.strokeStyle=CY;ctx.lineWidth=6;ctx.stroke();
 txt('SUBSCRIBE',0,6,'400 96px B',CY,'center',600,0);ctx.restore();}

// ---------- frame ----------
const fogC=new THREE.Color();const tmp=new THREE.Color();
function waterColor(d){const st=[[0,'#1e9bd7'],[200,'#0d5594'],[900,'#06274a'],[3000,'#03121f'],[11000,'#01060c']];
 for(let k=0;k<st.length-1;k++)if(d<=st[k+1][0]){const u=(d-st[k][0])/(st[k+1][0]-st[k][0]);return fogC.set(st[k][1]).lerp(tmp.set(st[k+1][1]),u);}return fogC.set('#01060c');}
window.renderAt=function(t){
 const i=segIndex(t);const inCut=i>=5;dive.visible=!inCut;cut.visible=inCut;
 if(!inCut){
  const depth=depthAt(t);const px=probeX(t);const py=-depth/10;
  probe.position.set(px,py+(depth<0?0:Math.sin(t*2)*.15),0);probe.rotation.set(Math.sin(t*1.3)*.08,t*.6,Math.sin(t*.9)*.06);
  // camera offset blending
  const s=SEG[i];const lt=t-(s.start-0.3);let off=OFF[Math.min(i,4)].clone();
  if(i>0){off=OFF[i-1].clone().lerp(OFF[Math.min(i,4)],ease(lt/1.3));}
  if(i===2){const a=lt*.12;off.applyAxisAngle(V(0,1,0),a);}
  if(i===1)off.applyAxisAngle(V(0,1,0),lt*.08);
  let tgt=probe.position.clone();
  if(i===3){tgt.lerp(titanic.position.clone().add(V(12,3,4)),.6*ease(lt/1.6));}
  if(i===4){tgt.y-=6*ease(lt/2);}
  const cp=probe.position.clone().add(off);
  if(i===4){const fl=clamp((cp.y-floorY(cp.x,cp.z))-6,-50,0);cp.y-=fl;}
  if(i<=3){const fy=floorY(cp.x,cp.z)+3;if(cp.y<fy)cp.y=fy;}
  camera.position.copy(cp);camera.lookAt(tgt);
  // environment
  const camD=-camera.position.y*10;
  if(camD<0){scene.background.set('#8fd6ff');scene.fog.color.set('#cdeeff');scene.fog.near=60;scene.fog.far=700;hemi.intensity=2.2;sun.intensity=2.4;}
  else{const wc=waterColor(camD);scene.background.copy(wc);scene.fog.color.copy(wc);
   const dk=clamp(camD/1200);scene.fog.near=lerp(8,4,dk);scene.fog.far=lerp(170,95,dk);
   hemi.intensity=1.8*Math.exp(-camD/220)+0.06;sun.intensity=2.2*Math.exp(-camD/150);amb.intensity=0.12+0.2*Math.exp(-camD/400);}
  shaftMat.opacity=0.08*clamp(1-camD/350)*clamp(camD/5);
  lamp.position.copy(probe.position).add(V(0,-2.5,3.5));lamp.intensity=depth>150?140:0;
  spot.position.copy(probe.position).add(V(0,-1.2,0));spot.target.position.copy(probe.position).add(V(i>=3?-6:0,-30,i>=3?-4:0));spot.intensity=depth>150?450:0;
  // waves
  const p=surf.geometry.attributes.position;for(let k=0;k<p.count;k++){const x=surfBase[k*3],z=surfBase[k*3+2];p.setY(k,Math.sin(x*.12+t*1.7)*.35+Math.cos(z*.15+t*1.3)*.3);}p.needsUpdate=true;surf.geometry.computeVertexNormals();
  // splash ring
  // whale
  const wt=t-S[2].start;whale.visible=i>=1&&i<=3;whale.position.set(-8+wt*1.6,-299.2+Math.sin(wt*.8)*.4,-5);whale.rotation.set(0,Math.sin(wt*.4)*.15,-0.08);
  whale.userData.tail.rotation.z=Math.sin(t*3.2)*.35;
  // snow follows camera, drifts up relative when descending
  for(let k=0;k<SNOW;k++){const bx=snowBase[k*3],by=snowBase[k*3+1],bz=snowBase[k*3+2];
   const wy=((by+depth/10*1.0+t*.3)%60+60)%60-30;snowP[k*3]=camera.position.x+bx;snowP[k*3+1]=camera.position.y+wy;snowP[k*3+2]=camera.position.z+bz;}
  snowG.attributes.position.needsUpdate=true;snow.visible=camD>2;snowMat.size=i===4&&t<S[4].start+3.6&&t>S[4].start+1.3?.35:.14;
  glowMat.opacity=0.5+0.4*Math.sin(t*3);
 } else {
  const lt=t-S[5].start;
  scene.background.set('#4a7fd0');scene.fog.near=99999;scene.fog.far=100000;hemi.intensity=1.2;sun.intensity=0;amb.intensity=.4;
  // Everest falls in from the sky
  const fall=clamp((lt-0.2)/1.4);const yOff=1500*(1-fall*fall);const bounce=lt>1.6?Math.exp(-(lt-1.6)*6)*Math.sin((lt-1.6)*20)*8:0;
  everest.position.set(0,BOTTOM+yOff+bounce,-10);
  const e=ease(lt/2.2);const cz=lerp(2400,2050,e)-Math.max(0,t-S[6].start)*40;const cy=lerp(-200,-480,e);
  camera.position.set(lerp(-500,-160,e),cy,cz);camera.lookAt(0,lerp(-150,-560,e),0);
 }
 camera.updateMatrixWorld();renderer.render(scene,camera);
 ctx.drawImage(glc,0,0);
 const g=ctx.createRadialGradient(W/2,H/2,H*0.28,W/2,H/2,H*0.78);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 if(!inCut){const depth=depthAt(t);drawDepth(t,depth);drawGauge(t,depth);if(i>=1&&i<=4)drawCard(i,t);}
 drawIntro(t);if(inCut)drawCut(t);if(i>=6)drawOutro(t);
 drawCaption(t);
 return out.toDataURL('image/jpeg',0.9);
};
await document.fonts.load('700 40px G');await document.fonts.load('400 40px G');await document.fonts.load('400 40px B');
window.READY=true;
