name: Skor tahmin botu

on:
  schedule:
    - cron: "17 6 * * *"   # her gün 09:17 (Türkiye saati)
  pull_request:
    paths: ["skor-botu/**", ".github/workflows/skor-botu.yml"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Telegram'a gönderme, sadece günlükte göster"
        type: boolean
        default: false
      date:
        description: "Tarih (YYYY-AA-GG), boş = bugün"
        required: false

permissions:
  contents: write

concurrency:
  group: skor-botu
  cancel-in-progress: false

jobs:
  bulten:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: skor-botu
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skor-botu/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - name: Bülteni oluştur ve gönder
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ] || [ "${{ github.event_name }}" = "pull_request" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          python run.py $ARGS
      - name: TFF önbelleğini kaydet
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "skor-botu"
          git config user.email "skor-botu@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "skor-botu: TFF verisi güncellendi" && git pull --rebase && git push)
